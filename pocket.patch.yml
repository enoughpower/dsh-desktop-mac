# Desktop-app overlay: register the phone-access plugin (dsh-pocket).
#
# dsh-pocket adds a 设置 → 手机访问 settings page: LAN QR code for phones on
# the same Wi-Fi, plus an optional cloudflared public tunnel (公网 QR). The
# phone then sees the same dsh web UI in real time.
#
# NOTE: the name must be quoted — linkBundledPlugins only collects quoted
# name: fields from - insert: blocks (the plugin's own cordis.patch.yml ships
# an unquoted name, which would not link it into the profile).
- insert:
    - id: dsh-pocket
      name: 'dsh-pocket'
